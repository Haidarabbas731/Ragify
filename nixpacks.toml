[phases.setup]
nixPkgs = ["python312", "python312Packages.pip"]
nixpkgsArchive = "e05605ec414618eab4a7a6aeaffdb1f1c780bf76"

[phases.install]
cmds = [
  "cd backend",
  "pip install --upgrade pip",
  "pip install uv",
  "uv sync --frozen"
]

[phases.build]
cmds = ["cd backend && uv run alembic upgrade head"]

[start]
cmd = "cd backend && uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
