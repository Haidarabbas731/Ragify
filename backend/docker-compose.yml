# Local development compose — spins up Postgres, Redis, and the app via Dockerfile.
# External services (Milvus/Zilliz, B2, Gemini) are configured via .env.
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up                # subsequent runs
#   docker compose down -v           # stop + wipe volumes

services:

  postgres:
    image: postgres:18-alpine
    container_name: ragify_postgres
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ragify_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragify_app
    env_file: .env
    environment:
      # Override to use container service names instead of localhost
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/knowledge_base
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  redis_data:

