# Local development compose — Postgres, Redis, standalone Milvus, and the app
# (split into `api` + `worker` so one crashing doesn't take the other down,
# matching the production topology used in docker-compose.dokploy.yml).
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up                # subsequent runs
#   docker compose down -v           # stop + wipe volumes

services:

  postgres:
    image: postgres:17-alpine
    container_name: ragify_postgres
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d knowledge_base" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: ragify_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v3.0.0
    container_name: ragify_milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./milvus-config/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
      - ./milvus-config/user.yaml:/milvus/configs/user.yaml
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ragify_api
    command: ["./scripts/start-api.sh"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/knowledge_base
      REDIS_URL: redis://redis:6379/0
      VECTOR_DB_URI: http://milvus:19530
      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: development
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - document_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: "unless-stopped"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ragify_worker
    command: ["./scripts/start-worker.sh"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/knowledge_base
      REDIS_URL: redis://redis:6379/0
      VECTOR_DB_URI: http://milvus:19530
      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: development
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - document_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: "unless-stopped"

volumes:
  postgres_data:
  redis_data:
  milvus_data:
  document_storage:

    # docker exec -it ragify_postgres psql -U postgres -d knowledge_base
