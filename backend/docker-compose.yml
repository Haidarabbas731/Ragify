# Local development compose — spins up Postgres, Redis, and the app via Dockerfile.
# Milvus uses the embedded Milvus Lite (.db file) — no separate container needed.
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up                # subsequent runs
#   docker compose down -v           # stop + wipe volumes

services:

  postgres:
    image: postgres:18-alpine
    container_name: ragify_postgres
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ragify_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ragify_app
    env_file: .env
    environment:
      # Override to use container service names instead of localhost
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/knowledge_base
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      # Milvus Lite — write to a dedicated writable directory inside the container
      VECTOR_DB_URI: ./milvus_data/ragify.db
      ENVIRONMENT: development
    volumes:
      # Mount source directories only — leaves .venv from the image untouched
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - milvus_data:/app/milvus_data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  milvus_data:

