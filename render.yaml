# =============================================================================
# Ragify Backend - Render Deployment Configuration
# =============================================================================
# 
# EXTERNAL SERVICES REQUIRED (Free Tiers Available):
# -------------------------------------------------
# 1. PostgreSQL: Neon (neon.tech) or Supabase (supabase.com)
# 2. Redis: Upstash (upstash.com) - REQUIRED for JWT blocklist & rate limiting
# 3. Milvus: Zilliz Cloud (zilliz.com) - Free serverless tier
# 4. File Storage: Backblaze B2 (backblaze.com) - 10GB free
# 5. Email: Resend (resend.com) - 3000 emails/month free
#
# SETUP STEPS:
# 1. Fork/push this repo to GitHub
# 2. Connect Render to your GitHub repo
# 3. Create external services (Neon, Upstash, Zilliz, B2, Resend)
# 4. Add secrets in Render Dashboard (marked with sync: false)
# 5. Deploy!
# =============================================================================

services:
  # =========================================================================
  # FastAPI Web Service (API Server)
  # =========================================================================
  - type: web
    name: ragify-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install uv && uv sync --frozen"
    startCommand: "cd backend && uv run alembic upgrade head && uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      # -----------------------------------------------------------------
      # DATABASE (PostgreSQL) - Use Neon or Supabase free tier
      # -----------------------------------------------------------------
      # Format: postgresql+asyncpg://user:password@host:5432/dbname
      - key: DATABASE_URL
        sync: false  # Add in Render Dashboard
      - key: DATABASE_POOL_SIZE
        value: "5"   # Keep low for free tier
      - key: DATABASE_MAX_OVERFLOW
        value: "5"

      # -----------------------------------------------------------------
      # REDIS - Use Upstash free tier (REQUIRED for auth)
      # -----------------------------------------------------------------
      # Format: rediss://default:password@host:port
      - key: REDIS_URL
        sync: false  # Add in Render Dashboard

      # -----------------------------------------------------------------
      # GOOGLE GEMINI (AI)
      # -----------------------------------------------------------------
      - key: GOOGLE_API_KEY
        sync: false  # Add in Render Dashboard
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: EMBEDDING_MODEL
        value: "models/gemini-embedding-001"
      - key: EMBEDDING_DIMENSION
        value: "768"

      # -----------------------------------------------------------------
      # MILVUS (Vector Database) - Use Zilliz Cloud free tier
      # -----------------------------------------------------------------
      # Format: https://your-instance.serverless.region.cloud.zilliz.com
      - key: MILVUS_URI
        sync: false  # Add in Render Dashboard
      - key: MILVUS_TOKEN
        sync: false  # Add in Render Dashboard
      - key: MILVUS_COLLECTION
        value: "knowledge_base"

      # -----------------------------------------------------------------
      # BACKBLAZE B2 (File Storage) - 10GB free
      # -----------------------------------------------------------------
      - key: B2_APPLICATION_KEY_ID
        sync: false  # Add in Render Dashboard
      - key: B2_APPLICATION_KEY
        sync: false  # Add in Render Dashboard
      - key: B2_BUCKET_NAME
        sync: false  # Add in Render Dashboard

      # -----------------------------------------------------------------
      # EMAIL (Resend) - 3000 emails/month free
      # -----------------------------------------------------------------
      - key: RESEND_API_KEY
        sync: false  # Add in Render Dashboard
      - key: EMAIL_FROM_ADDRESS
        sync: false  # e.g., noreply@yourdomain.com
      - key: EMAIL_FROM_NAME
        value: "Ragify"

      # -----------------------------------------------------------------
      # JWT SECURITY
      # -----------------------------------------------------------------
      # Generate with: openssl rand -hex 32
      - key: JWT_SECRET_KEY
        sync: false  # Add in Render Dashboard
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # -----------------------------------------------------------------
      # APPLICATION
      # -----------------------------------------------------------------
      - key: APP_NAME
        value: "Ragify"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: FRONTEND_URL
        value: "*"  # Allow all origins until frontend is deployed

      # -----------------------------------------------------------------
      # FILE UPLOAD
      # -----------------------------------------------------------------
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: MAX_UPLOAD_BATCH
        value: "10"
      - key: ALLOWED_FILE_TYPES
        value: "pdf,docx,txt,md"

      # -----------------------------------------------------------------
      # TEXT CHUNKING
      # -----------------------------------------------------------------
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"

      # -----------------------------------------------------------------
      # RAG CHAT
      # -----------------------------------------------------------------
      - key: CONVERSATION_HISTORY_LIMIT
        value: "5"

      # -----------------------------------------------------------------
      # STORAGE & RATE LIMITING
      # -----------------------------------------------------------------
      - key: STORAGE_QUOTA_DEFAULT
        value: "1073741824"  # 1GB in bytes
      - key: RATE_LIMIT_PER_MINUTE
        value: "100"

      # -----------------------------------------------------------------
      # REGISTRATION
      # -----------------------------------------------------------------
      - key: INVITE_ONLY
        value: "true"

  # =========================================================================
  # ARQ Background Worker (Document Processing)
  # =========================================================================
  - type: worker
    name: ragify-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install uv && uv sync --frozen"
    startCommand: "cd backend && uv run arq app.tasks.worker.WorkerSettings"
    envVars:
      # Database & Redis
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # Google Gemini
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: EMBEDDING_MODEL
        value: "models/gemini-embedding-001"
      - key: EMBEDDING_DIMENSION
        value: "768"

      # Milvus
      - key: MILVUS_URI
        sync: false
      - key: MILVUS_TOKEN
        sync: false
      - key: MILVUS_COLLECTION
        value: "knowledge_base"

      # Backblaze B2
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false

      # Text Chunking
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"

      # Application
      - key: ENVIRONMENT
        value: "production"
      - key: LOG_LEVEL
        value: "INFO"

# =============================================================================
# NOTE: Render does NOT have managed Redis. You MUST use Upstash or similar.
# 
# RECOMMENDED FREE TIER SERVICES:
# - PostgreSQL: Neon (neon.tech) - Best free tier, no expiry
# - Redis: Upstash (upstash.com) - Serverless, pay-per-use, generous free tier
# - Milvus: Zilliz Cloud (zilliz.com) - Free serverless vector DB
# - Storage: Backblaze B2 (backblaze.com) - 10GB free
# - Email: Resend (resend.com) - 3000 emails/month free
# =============================================================================
