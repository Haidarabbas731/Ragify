<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Ragify" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Apply the saved or system theme before first paint to avoid a flash
    (function () {
      try {
        var saved = localStorage.getItem("darkMode");
        var dark = saved !== null ? JSON.parse(saved) : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <title>Ragify - Transform Your Documents with AI</title>
  <meta name="description"
    content="Ask questions about your own PDFs, Word, text and Markdown files, and see exactly which passage each answer came from." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ragify - Ask your documents" />
  <meta property="og:description"
    content="Upload your files, ask in plain language, and see the source behind every answer." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
